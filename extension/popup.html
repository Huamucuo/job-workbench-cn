<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求职填写助手</title><link rel="stylesheet" href="./autofill/autofill.css"><link rel="stylesheet" href="./popup.css"><script type="module" src="./popup.mjs"></script></head><body class="extension-popup">
<header class="popup-top"><strong>职有引力 · Beta 填写助手</strong><button type="button" id="manage" class="af-button secondary">我的档案</button></header>
<section class="af-panel session-entry"><h1>这次网申，接着填</h1><p>打开常驻侧栏，后续页面自动检测、核对后填写。默认免口令；开启保护后只需解锁一次。</p><button type="button" id="open-session" class="af-button" disabled>开始跨页填写</button><p id="session-open-status" role="status">请先在当前招聘页面完成登录。</p></section>
<details id="workbench-approval" class="af-panel" hidden><summary>旧资料迁移与网页连接（按需）</summary><p id="connection-details"></p><label class="af-check"><input type="checkbox" id="connection-consent">我允许当前本机工作台在30分钟内访问加密档案和字段对应记录。</label><button id="approve-workbench" class="af-button" disabled>批准工作台连接</button><button id="revoke-workbench" class="af-button secondary">断开所有工作台连接</button><p id="connection-result" role="status">此连接不传输口令或明文简历，不授权招聘网站。</p></details>
<section id="unlock-box" class="af-panel"><h2>单页填写（原入口）</h2><p>也可以在此处理一页。默认免口令；保护模式重新打开时需要解锁。</p><label class="af-field">档案口令<input id="password" type="password" autocomplete="off" maxlength="512"></label><button id="unlock" type="button" class="af-button">解锁档案</button><p id="unlock-status" role="status">首次使用请进入我的档案，新建或导入加密档案。</p></section><div id="panel" hidden></div><footer class="popup-footer">仅在你点击扩展后访问当前页 · 不自动提交 · 不使用第三方 AI</footer></body></html>
