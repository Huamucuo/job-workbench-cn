<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>职有引力 · 跨页填写</title><link rel="stylesheet" href="./autofill/autofill.css"><link rel="stylesheet" href="./sidepanel.css"><script type="module" src="./sidepanel.mjs"></script></head><body>
<header class="session-top"><strong>职有引力 · 跨页填写</strong><button id="session-manage" class="af-button secondary" type="button">我的档案</button></header>
<main><section class="session-summary"><p id="session-target">请在招聘页面点击扩展，选择“开始跨页填写”。</p><p id="session-status" role="status" aria-live="polite">默认免口令，后续页面自动准备预览；每页核对后填写。</p><div class="af-actions"><button id="session-lock" class="af-button secondary" type="button">锁定资料</button><button id="session-end" class="af-button secondary" type="button">结束本次网申</button></div></section>
<section id="session-gate" class="af-panel"><h1>解锁一次，接着填下一页</h1><p>只用于开始时的招聘标签页。资料不会交给页面读取；只有你核对后点击填写的字段才写入网页。</p><label class="af-field">档案口令<input id="session-password" type="password" autocomplete="off" maxlength="512"></label><button id="session-unlock" class="af-button" type="button" disabled>解锁并开始本次网申</button><p class="af-muted">5分钟未操作助手会结束本次授权；最长30分钟。需继续时点击开始；只有开启口令保护的档案才需解锁。</p></section>
<div id="continuous-panel" hidden></div>
<details id="session-log" hidden><summary>本次填写记录</summary><ol id="session-history"></ol></details>
<footer>网页的保存、下一步、附件上传和最终提交由你完成。网站可能即时读取已填内容。换站、换申请或权限丢失时会暂停。</footer></main></body></html>
